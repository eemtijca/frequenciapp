# Valores padrão do chart do FrequenciApp.
# Não coloque segredos neste arquivo. Use existingSecret ou um gerenciador externo.

replicaCount: 1

image:
  repository: ghcr.io/eemtijca/frequenciapp
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

backupImage:
  repository: ghcr.io/eemtijca/frequenciapp-backup
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: frequencia.exemplo.br
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: frequenciapp-tls
  #   hosts:
  #     - frequencia.exemplo.br

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

config:
  TZ_APP: America/Fortaleza
  PERMITIR_HTTP: "false"
  MIGRAR_NA_PARTIDA: "false"
  COMMIT_SHA: ""

# Nome do Secret com DATABASE_URL, DIRECT_URL, AUTH_SECRET, CRON_SECRET
# e os opcionais GOOGLE_*, PUSH_VAPID_*, FERIADOS_* e ADMIN_*.
existingSecret: ""

# Alternativa de desenvolvimento. Para produção, prefira existingSecret.
secrets:
  create: false
  data: {}

extraEnv: []
extraEnvFrom: []

migrations:
  enabled: true
  resources: {}

probes:
  liveness:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    httpGet:
      path: /api/saude
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

persistence:
  nextCache:
    enabled: true
    sizeLimit: 1Gi
  tmp:
    enabled: true
    sizeLimit: 256Mi

agenda:
  enabled: true
  schedule: "*/5 * * * *"
  # Fuso IANA do CronJob. Exige Kubernetes 1.27 ou superior quando preenchido.
  timeZone: ""
  appUrl: ""
  existingSecret: ""
  concurrencyPolicy: Forbid
  backoffLimit: 3
  activeDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources: {}
  extraEnv: []

# Bloqueio de migração e rollout sem backup confirmado. O gate é sempre
# renderizado; o modo de ensaio é a única exceção explícita.
backupGate:
  # Idade máxima do recibo do último backup do banco.
  maxAgeHours: 36
  # Exige que o recibo confirme a verificação da cópia remota.
  requireRemoteVerification: false
  # Ensaio explícito sem backup confirmado. Não há proteção nem promessa de
  # recuperação enquanto este valor for true.
  ensaioSemProtecao: false
  resources: {}

backup:
  enabled: false
  retentionDays: 30
  retentionMinimum: 5
  remoteRetention: false
  minimumSpaceMB: 128
  # Secret com os arquivos rclone.conf, backup-publica.asc e age-recipients.txt.
  filesSecret: ""
  # Secret com BACKUP_DATABASE_URL, BACKUP_CRIPTOGRAFIA, BACKUP_GPG_DESTINATARIO,
  # BACKUP_AGE_DESTINATARIOS, BACKUP_REMOTO e RCLONE_CONFIG_PASS.
  database:
    enabled: true
    schedule: "30 2 * * *"
    timeZone: ""
    existingSecret: ""
    local: true
    persistence:
      enabled: false
      size: 20Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
  # Secret com BACKUP_ORIGEM, BACKUP_DESTINO, BACKUP_CHAVE e RCLONE_CONFIG_PASS.
  spreadsheets:
    enabled: true
    schedule: "0 3 * * *"
    timeZone: ""
    existingSecret: ""
    local: true
  concurrencyPolicy: Forbid
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1
