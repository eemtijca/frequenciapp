{{/* ServiceMonitor opcional. Requer o Prometheus Operator e a CRD instalados no cluster. */}}
{{- $metricas := default (dict) .Values.metrics -}}
{{- $serviceMonitor := default (dict) $metricas.serviceMonitor -}}
{{- if $serviceMonitor.enabled }}
{{- include "frequenciapp.validateMetrics" . }}
{{- $rotulos := include "frequenciapp.labels" . | fromYaml }}
{{- $rotulos = merge $rotulos (default (dict) $serviceMonitor.labels) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "frequenciapp.fullname" . }}
  labels:
    {{- toYaml $rotulos | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "frequenciapp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /api/metricas
      interval: {{ $serviceMonitor.interval | quote }}
      scrapeTimeout: {{ $serviceMonitor.scrapeTimeout | quote }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "frequenciapp.metricsTokenSecretName" . | quote }}
          key: {{ include "frequenciapp.metricsTokenKey" . | quote }}
{{- end }}
