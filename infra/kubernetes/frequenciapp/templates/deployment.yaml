apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frequenciapp.fullname" . }}
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "frequenciapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frequenciapp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include "frequenciapp.secretChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "frequenciapp.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: migrar
          image: {{ include "frequenciapp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "./docker/app/migrar.mjs"]
          envFrom:
            - configMapRef:
                name: {{ include "frequenciapp.fullname" . }}
            - secretRef:
                name: {{ include "frequenciapp.secretName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: app
          image: {{ include "frequenciapp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "frequenciapp.fullname" . }}
            - secretRef:
                name: {{ include "frequenciapp.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: COMMIT_SHA
              value: {{ default (default .Chart.AppVersion .Values.image.tag) .Values.config.COMMIT_SHA | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.nextCache.enabled }}
            - name: next-cache
              mountPath: /app/.next/cache
            {{- end }}
            {{- if .Values.persistence.tmp.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        {{- if .Values.persistence.nextCache.enabled }}
        - name: next-cache
          emptyDir:
            sizeLimit: {{ .Values.persistence.nextCache.sizeLimit }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.persistence.tmp.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
