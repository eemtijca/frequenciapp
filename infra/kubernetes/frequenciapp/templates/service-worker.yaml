{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frequenciapp.fullname" . }}-worker
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 3001
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "frequenciapp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
