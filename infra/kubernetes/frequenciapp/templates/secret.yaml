{{- if and .Values.secrets.create (not .Values.existingSecret) }}
{{- if and .Values.metrics.token (hasKey .Values.secrets.data "METRICAS_TOKEN") }}
{{- fail "Use apenas metrics.token ou secrets.data.METRICAS_TOKEN, não os dois" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frequenciapp.fullname" . }}
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $chave, $valor := .Values.secrets.data }}
  {{ $chave }}: {{ $valor | quote }}
  {{- end }}
  {{- with .Values.metrics.token }}
  METRICAS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
