{{- if and .Values.secrets.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frequenciapp.fullname" . }}
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $chave, $valor := .Values.secrets.data }}
  {{ $chave }}: {{ $valor | quote }}
  {{- end }}
{{- end }}
