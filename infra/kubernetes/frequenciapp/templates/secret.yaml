{{- if and .Values.secrets.create (not .Values.existingSecret) }}
{{- $metricas := default (dict) .Values.metrics }}
{{- $dados := default (dict) .Values.secrets.data }}
{{- if and $metricas.token (hasKey $dados "METRICAS_TOKEN") }}
{{- fail "Use apenas metrics.token ou secrets.data.METRICAS_TOKEN, não os dois" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frequenciapp.fullname" . }}
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $chave, $valor := $dados }}
  {{ $chave }}: {{ $valor | quote }}
  {{- end }}
  {{- with $metricas.token }}
  METRICAS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
