apiVersion: v1
kind: Pod
metadata:
  name: {{ include "frequenciapp.fullname" . }}-test-connection
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "frequenciapp.serviceAccountName" . }}
  {{- with .Values.image.pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: verificar
      image: {{ include "frequenciapp.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - node
        - -e
        - >-
          fetch("http://{{ include "frequenciapp.fullname" . }}:{{ .Values.service.port }}/api/saude")
          .then((resposta) => process.exit(resposta.ok ? 0 : 1))
          .catch(() => process.exit(1))
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
