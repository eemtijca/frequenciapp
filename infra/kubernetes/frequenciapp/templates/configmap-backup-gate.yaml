apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frequenciapp.fullname" . }}-backup-gate-script
  labels:
    {{- include "frequenciapp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  verificar-backup.sh: |-
    {{- .Files.Get "files/verificar-backup.sh" | nindent 4 }}
