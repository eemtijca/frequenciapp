# Coleta do Prometheus na auto-hospedagem: o aplicativo é lido pela rede
# interna, o próprio Prometheus é autocoletado e o volume guarda 15 dias.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    installation: frequenciapp

storage:
  tsdb:
    retention:
      time: 15d
      size: 1GB

rule_files:
  - /etc/prometheus/regras.yml

scrape_configs:
  - job_name: frequenciapp
    metrics_path: /api/metricas
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /tmp/metricas-token
    static_configs:
      - targets:
          - app:3000
    sample_limit: 20000

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
