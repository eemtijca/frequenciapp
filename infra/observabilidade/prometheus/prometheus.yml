# Coleta do Prometheus na auto-hospedagem: aplicativo, host, sonda HTTPS e o
# próprio Prometheus, com 15 dias de retenção no volume.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    installation: frequenciapp

storage:
  tsdb:
    retention:
      time: 15d
      size: 1GB

rule_files:
  - /etc/prometheus/regras.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: frequenciapp
    metrics_path: /api/metricas
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /tmp/metricas-token
    static_configs:
      - targets:
          - app:3000
    sample_limit: 20000

  - job_name: frequenciapp-worker
    metrics_path: /metricas
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /tmp/metricas-token
    static_configs:
      - targets:
          - worker:3001
    sample_limit: 20000

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://proxy:443/api/saude
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
