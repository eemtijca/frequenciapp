# Regras de alerta das fases 1 e 2: aplicação, host, HTTPS e certificado.

groups:
  - name: frequenciapp
    rules:
      - alert: FrequenciappIndisponivel
        expr: up{job="frequenciapp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A coleta do FrequenciApp falhou."
          description: "O alvo app:3000 não responde há mais de 2 minutos."

      - alert: FrequenciappErros5xx
        expr: |
          (
            sum(rate(frequenciapp_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(frequenciapp_http_requests_total[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erros 5xx acima de 5%."
          description: "A proporção de respostas 5xx passou de 5% nos últimos 5 minutos."

      - alert: FrequenciappLatenciaP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(frequenciapp_http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latência p95 acima de 5 segundos."
          description: "O percentil 95 das requisições passou de 5 segundos nos últimos 5 minutos."

      - alert: FrequenciappPoolAguardando
        expr: frequenciapp_db_pool_connections{state="waiting"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Requisições aguardando conexão do banco."
          description: "O pool tem requisições aguardando conexão há mais de 10 minutos."

      - alert: FrequenciappFilaPlanilhaParada
        expr: |
          (
            frequenciapp_fila_planilha_itens{estado=~"AGUARDANDO|EM_ANDAMENTO|FALHOU"} > 0
            and
            (time() - frequenciapp_fila_planilha_mais_antiga_timestamp_seconds) > 3600
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fila de envio à planilha parada."
          description: "O item aberto mais antigo da fila passou de 1 hora."

      - alert: FrequenciappDiscoBaixo
        expr: |
          (
            min by (instance, job) (
              node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!~"/var/lib/docker/.+"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!~"/var/lib/docker/.+"}
            )
          ) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Espaço em disco abaixo de 15%."
          description: "Um sistema de arquivos do host está com menos de 15% livre há mais de 15 minutos. O caminho do ponto de montagem fica apenas na métrica local."

      - alert: FrequenciappMemoriaBaixa
        expr: |
          (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memória disponível abaixo de 10%."
          description: "O host está com menos de 10% de memória disponível há mais de 10 minutos."

      - alert: FrequenciappSondaHttps
        expr: probe_success{job="blackbox"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A sonda HTTPS do FrequenciApp falhou."
          description: "A sonda não obteve resposta 200 do alvo https://proxy:443/api/saude há mais de 5 minutos. A falha pode ser do serviço observado, do proxy ou da própria sonda."

      - alert: FrequenciappSondaColetorIndisponivel
        expr: up{job="blackbox"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "O coletor da sonda HTTPS está indisponível."
          description: "O blackbox exporter não responde à coleta há mais de 5 minutos. O estado do site não pode ser confirmado enquanto o coletor estiver fora do ar."

      - alert: FrequenciappSondaSemAmostra
        expr: absent(probe_success{job="blackbox"}) and on(job) (up{job="blackbox"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A sonda HTTPS está sem amostra."
          description: "O coletor blackbox está no ar, mas não publicou probe_success há mais de 10 minutos. A sonda pode estar travada ou sem alvo."

      - alert: FrequenciappCertificadoExpirando
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificado TLS expira em menos de 14 dias."
          description: "O certificado do alvo {{ $labels.instance }} expira em menos de 14 dias."

      - alert: FrequenciappAlertmanagerFalhaNotificacao
        expr: rate(alertmanager_notifications_failed_total{job="alertmanager"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "O Alertmanager falha ao entregar notificações."
          description: "Há notificações com falha no receptor há mais de 10 minutos."

      - alert: FrequenciappBackupAtrasado
        expr: (time() - frequenciapp_backup_ultimo_sucesso_timestamp_seconds) > 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "O último backup verificado tem mais de 24 horas."
          description: "O backup do banco não é verificado com sucesso há mais de 24 horas."
