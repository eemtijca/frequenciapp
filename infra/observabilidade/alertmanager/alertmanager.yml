# Modelo do Alertmanager: a URL do webhook fica em arquivo restrito e a
# configuração gerada usa url_file. O entrypoint grava esse arquivo, a senha
# SMTP e um eventual token de autorização fora da configuração.
route:
  receiver: frequenciapp
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: frequenciapp
    webhook_configs:
      - url_file: /tmp/alertmanager-webhook-url
        # AUTORIZACAO_WEBHOOK
        send_resolved: true
