# Nginx no modo inicial: desafio ACME e aviso enquanto o certificado não existe.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 503 "Certificado em preparação.\n";
    }
}
