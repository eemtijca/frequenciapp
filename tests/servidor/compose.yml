# Compose descartável dos ensaios de servidor. Não publica portas e usa
# somente imagens públicas, sem dados reais.
name: ${COMPOSE_PROJECT_NAME:-frequenciapp-testes}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frequencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frequencia}
      POSTGRES_DB: ${POSTGRES_DB:-frequencia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frequencia} -d ${POSTGRES_DB:-frequencia}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 0"]
      interval: 2s
      timeout: 2s
      retries: 10

  caddy:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 0"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
