# Configuração do pnpm. O projeto não tem workspaces; o arquivo existe porque,
# a partir do pnpm 11, as configurações ficam em pnpm-workspace.yaml.
# allowBuilds autoriza apenas os scripts de instalação necessários ao build.
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  # Telemetria transitiva do Redocly: o script não é necessário e fica negado.
  "@scarf/scarf": false
  "@swc/core": true
  prisma: true
  sharp: true
  unrs-resolver: true

# Correções de segurança em dependências transitivas. O fast-uri é usado pelo
# ajv e o minimatch 10 pelo parser do typescript-eslint; as versões fixadas
# abaixo são as primeiras sem os alertas do Dependabot.
overrides:
  fast-uri@3.1.8: 3.1.9
  minimatch@10.2.6: 11.0.1
