<!doctype html>
<!-- Tela de reconexão com estilos próprios para funcionar sem a rede. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sem conexão · FrequenciApp</title>
    <style>
      :root {
        color-scheme: light dark;
        --fundo: #f6f6f6;
        --superficie: #ffffff;
        --borda: #e4e4e2;
        --tinta: #262626;
        --tinta-fraca: #595959;
        --verde: #1d7253;
        --verde-texto: #effaf6;
        --emblema-fundo: rgba(29, 114, 83, 0.1);
        --foco: #1d7253;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--fundo);
        color: var(--tinta);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fundo: #141413;
          --superficie: #1f1e1d;
          --borda: #393837;
          --tinta: #ffffff;
          --tinta-fraca: #a6a6a6;
          --verde: #81cfb3;
          --verde-texto: #082b1e;
          --emblema-fundo: rgba(129, 207, 179, 0.15);
          --foco: #81cfb3;
        }
      }
      .cartao {
        background: var(--superficie);
        border: 1px solid var(--borda);
        border-radius: 8px;
        max-width: 360px;
        width: 100%;
        padding: 32px 24px;
        text-align: center;
      }
      .emblema {
        width: 56px;
        height: 56px;
        border-radius: 8px;
        background: var(--emblema-fundo);
        color: var(--verde);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
      }
      .letra {
        color: var(--tinta-fraca);
        margin-top: 8px;
      }
      a.tentar {
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        margin-top: 20px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--verde);
        color: var(--verde-texto);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      a.tentar:focus-visible {
        outline: 3px solid var(--foco);
        outline-offset: 2px;
      }
      a.tentar:active {
        transform: scale(0.98);
      }
      @media (prefers-reduced-motion: reduce) {
        a.tentar:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="cartao">
      <div class="emblema" aria-hidden="true">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>Sem conexão</h1>
      <p>
        A frequência precisa de internet para salvar. As marcações que estiverem na tela não se
        perdem: reconecte e toque em Salvar.
      </p>
      <p class="letra">Verifique o sinal ou os dados móveis e tente de novo.</p>
      <a class="tentar" href="">Tentar de novo</a>
    </main>
  </body>
</html>
