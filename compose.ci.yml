# FrequenciApp. Sobreposição do Compose somente para o CI (test-db.yml).
# Reaproveita compose.yml e adiciona apenas o necessário aos testes:
# segredos fictícios e a imagem já construída pelo workflow.
# ATENÇÃO: se compose.yml ganhar variável obrigatória nova, ela precisa
# ser espelhada aqui.
services:
  app:
    # Imagem construída pelo passo de build do workflow (com cache).
    # O `up -d` sem `--build` a reaproveita; sem ela, o Compose compila.
    image: frequenciapp:ci
    environment:
      AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
