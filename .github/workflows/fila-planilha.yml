# Recolhe os envios automáticos à planilha que sobraram na fila, a cada cinco minutos.
name: Agenda da fila de planilhas

on:
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agenda-fila-planilhas
  cancel-in-progress: false

jobs:
  verificar:
    name: Processar a fila de envios às planilhas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ vars.NOTIFICACOES_APP_URL || 'https://frequenciappjca.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verificar configuração da agenda
        id: configuracao
        shell: bash
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "A agenda da fila aguarda o segredo CRON_SECRET do repositório."
            echo "pronta=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Processar itens pendentes
        if: steps.configuracao.outputs.pronta == 'true'
        shell: bash
        run: |
          [[ "$APP_URL" == https://* ]] || { echo "A agenda exige um endereço HTTPS."; exit 1; }
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 10 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --url "${APP_URL%/}/api/planilha/fila/agenda"

      - name: Atualizar indicadores agregados
        if: always() && steps.configuracao.outputs.pronta == 'true'
        shell: bash
        run: |
          [[ "$APP_URL" == https://* ]] || { echo "A agenda exige um endereço HTTPS."; exit 1; }
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 10 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --url "${APP_URL%/}/api/indicadores/agenda"
