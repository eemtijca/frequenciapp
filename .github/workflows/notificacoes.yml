# Agenda periódica para hospedagens com limite de cron, como Vercel Hobby.
name: Agenda de notificações

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agenda-notificacoes
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar avisos da escola
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.NOTIFICACOES_APP_URL || 'https://frequenciappjca.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verificar configuração da agenda
        id: configuracao
        shell: bash
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "A agenda aguarda o segredo CRON_SECRET do repositório."
            echo "pronta=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronta=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Consultar avisos devidos
        if: steps.configuracao.outputs.pronta == 'true'
        shell: bash
        run: |
          [[ "$APP_URL" == https://* ]] || { echo "A agenda exige um endereço HTTPS."; exit 1; }
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 10 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --url "${APP_URL%/}/api/notificacoes/agenda"
