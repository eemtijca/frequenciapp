# Uma única seção serializada para construir, migrar, promover e verificar a revisão.
name: Implantação
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versao:
        description: Versão da tag estável; vazio para publicar a main
        type: string
        required: false
  workflow_call:
    inputs:
      versao:
        description: Versão da tag estável; vazio para publicar a main
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: implantacao-producao
  cancel-in-progress: false
jobs:
  implantar:
    if: |
      (github.event_name != 'release' || github.event.release.prerelease == false) &&
      (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'vercel')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Orquestrar a mesma revisão
        env:
          IMPLANTACAO_VERSAO: ${{ inputs.versao }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DIRECT_URL_PROD: ${{ secrets.DIRECT_URL_PROD }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/github/orquestrar-implantacao.mjs
