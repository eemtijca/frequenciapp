# Valida propostas de banco sem environment, credencial de banco ou token de plataforma.
name: Schema do preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - prisma/**
      - scripts/github/validar-preview.mjs
      - .github/workflows/schema-preview.yml
permissions:
  contents: read
concurrency:
  group: preview-validar-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validar proposta sem provisionamento
        run: node scripts/github/validar-preview.mjs
