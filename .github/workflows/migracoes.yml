# Entrada legada: delega a sequência inteira, sem segundo caminho de migração.
name: Migrações do banco
on:
  workflow_dispatch:
    inputs:
      versao:
        description: Versão da tag estável; vazio para publicar a main
        type: string
        required: false
permissions:
  contents: read
jobs:
  orquestrar:
    if: vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'vercel'
    uses: ./.github/workflows/implantacao.yml
    with:
      versao: ${{ inputs.versao }}
    secrets: inherit
