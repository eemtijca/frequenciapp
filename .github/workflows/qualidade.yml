name: Qualidade

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
  DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
  AUTH_SECRET: segredo-dummy-de-32-bytes-para-ci-0000
  TZ_APP: America/Fortaleza

jobs:
  qualidade:
    name: Formatação, lint, tipos e unidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar formatação
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run tsc

      - name: Testes unitários
        run: pnpm run test:unit

      - name: Lint da especificação OpenAPI
        run: pnpm run lint:api
