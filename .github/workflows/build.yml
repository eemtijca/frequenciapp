# Compilação com o mesmo comando de instalação configurado para a Vercel.
name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
  DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
  AUTH_SECRET: segredo-dummy-de-32-bytes-para-ci-0000
  TZ_APP: America/Fortaleza

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Conferir a instalação da Vercel
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { installCommand } = JSON.parse(readFileSync('vercel.json', 'utf8'));
          const resultado = spawnSync(installCommand, {
            shell: true,
            stdio: 'inherit',
            env: { ...process.env, NODE_ENV: 'production' },
          });
          if (resultado.error) throw resultado.error;
          process.exit(resultado.status ?? 1);
          JS

      - name: Build
        run: pnpm run build
