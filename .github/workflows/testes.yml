name: Testes

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # Necessário para o cache GHA do build Docker.

env:
  # AUTH_SECRET é exigida na interpolação do compose.yml; o valor em
  # execução no contêiner vem do compose.ci.yml.
  AUTH_SECRET: segredo-dummy-de-32-bytes-para-testes-00
  DATABASE_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
  DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
  TZ_APP: America/Fortaleza
  # A mesma revisão precisa chegar ao rótulo da imagem e à saúde da aplicação.
  COMMIT_SHA: ${{ github.sha }}
  APP_URL: http://127.0.0.1:3000

jobs:
  testes:
    name: Compose, migrações e contratos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testar migração protegida em PostgreSQL isolado
        run: |
          docker pull node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
          docker pull postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            bash tests/servidor/ensaio-migracoes-auto.sh --regressoes

      - name: Preparar chaves sintéticas de push
        run: node tests/gerar-ambiente-push.mjs "$GITHUB_ENV"

      - name: Validar configurações do Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.ci.yml config --quiet

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Preparar contexto com permissões restritivas
        id: contexto-imagem
        run: |
          umask 077
          raiz=$(mktemp -d "$RUNNER_TEMP/frequenciapp-build.XXXXXXXX")
          contexto="$raiz/worktree"
          git worktree add --detach "$contexto" "$COMMIT_SHA"
          test "$(git -C "$contexto" rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(stat -c '%a' "$contexto/docker/app")" = 700
          printf 'caminho=%s\n' "$contexto" >> "$GITHUB_OUTPUT"

      - name: Construir imagem (com cache, valida o Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.contexto-imagem.outputs.caminho }}
          push: false
          load: true
          tags: frequenciapp:ci
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir a revisão e a configuração padrão da imagem
        run: |
          revisao=$(docker image inspect frequenciapp:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revisao" = "$COMMIT_SHA"
          test "$(docker image inspect frequenciapp:ci --format '{{.Config.User}}')" = node
          # O Compose redefine o comando, então o teste de saúde não confere o CMD da imagem.
          test "$(docker image inspect frequenciapp:ci --format '{{json .Config.Cmd}}')" = '["./docker/app/entrypoint.sh"]'

      - name: Gerar cliente Prisma
        run: pnpm run db:generate

      - name: Subir aplicação e banco
        run: docker compose -f compose.yml -f compose.ci.yml up -d

      - name: Aguardar a aplicação
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/saude > "$RUNNER_TEMP/saude.json"; then
              node --input-type=module -e '
                import assert from "node:assert/strict";
                import fs from "node:fs";
                const saude = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                assert.equal(saude.ok, true);
                assert.equal(saude.commit, process.env.COMMIT_SHA);
              ' "$RUNNER_TEMP/saude.json"
              echo "Aplicação disponível após ${tentativa} tentativa(s)."
              exit 0
            fi
            sleep 5
          done
          echo "A aplicação não respondeu no tempo esperado."
          docker compose -f compose.yml -f compose.ci.yml logs app
          exit 1

      - name: Testar o migrador real em banco descartável
        # Cria e derruba bancos migracao_qa_* no PostgreSQL do Compose, sem
        # tocar no banco da aplicação.
        env:
          MIGRADOR_BANCO_DESCARTAVEL: "true"
          DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
        run: node --test tests/servidor/migrar-real.test.mjs

      - name: Validar scripts administrativos no contêiner
        run: |
          # Exercita o dotenv e o driver pg dentro da imagem, além do
          # módulo de decisão do bootstrap (--somente-criar).
          docker compose -f compose.yml -f compose.ci.yml exec -T \
            -e ADMIN_EMAIL=bootstrap@escola.exemplo \
            -e ADMIN_SENHA=BootstrapFrequencia2026 \
            -e ADMIN_NOME=Bootstrap \
            app node scripts/administracao/criar-admin.mjs --somente-criar

      - name: Criar administrador de teste
        env:
          ADMIN_EMAIL: direcao@escola.exemplo
          ADMIN_SENHA: DirecaoFrequencia2026
          ADMIN_NOME: Direção
        run: pnpm run criar-admin

      - name: Criar coordenação de teste
        env:
          CONTA_EMAIL: demo@escola.exemplo
          CONTA_SENHA: DemoFrequencia2026
          CONTA_NOME: Demo
        run: pnpm run criar-coordenacao

      - name: Testes de contratos da API
        env:
          METRICAS_TOKEN: metricas-token-sintetico-ci-000000000000
        run: pnpm run test:api

      - name: Instalar navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes de ponta a ponta (Playwright)
        env:
          # localhost: o storageState do Playwright envia o cookie Secure do
          # build de produção quando o host é tratado como local.
          E2E_BANCO_SINTETICO: "true"
          TEST_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          DATABASE_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
          DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
        run: pnpm run test:e2e:chromium

      - name: Testes de PWA (Playwright)
        env:
          E2E_BANCO_SINTETICO: "true"
          TEST_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          DATABASE_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
          DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
        run: pnpm run test:pwa --project=chromium

      - name: Validar a semente de demonstração
        # Depois do e2e: o cenário de banco vazio depende da base limpa.
        env:
          CONTA_EMAIL: demo@escola.exemplo
          DIRECT_URL: postgresql://frequencia:frequencia@localhost:5432/frequencia
          SEED_PERFIL: leve
        run: pnpm run seed

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose -f compose.yml -f compose.ci.yml logs

      - name: Derrubar o ambiente
        if: always()
        run: docker compose -f compose.yml -f compose.ci.yml down -v --remove-orphans
