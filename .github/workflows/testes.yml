# Executa pilhas sintéticas e conserva somente evidências mínimas por allowlist.
name: Testes

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EVIDENCIAS_CI: frequenciapp-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  testes:
    name: Pilhas exclusivas, API, navegador e PWA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Reservar destinos exclusivos de evidências
        id: evidencias_preparo
        run: node tests/isolamento/evidencias-ci.mjs preparar --raiz "$RUNNER_TEMP/$EVIDENCIAS_CI"

      - name: Compose, migrações, administração e seed da imagem de distribuição
        if: ${{ !cancelled() && steps.evidencias_preparo.outcome == 'success' }}
        run: node tests/isolamento/evidencias-ci.mjs executar --raiz "$RUNNER_TEMP/$EVIDENCIAS_CI" --etapa distribuicao -- node tests/isolamento/executar.mjs --validar-distribuicao

      - name: Contratos de API com banco e runtime exclusivos
        if: ${{ !cancelled() && steps.evidencias_preparo.outcome == 'success' }}
        run: node tests/isolamento/evidencias-ci.mjs executar --raiz "$RUNNER_TEMP/$EVIDENCIAS_CI" --etapa api -- node tests/isolamento/executar.mjs --artefatos "$RUNNER_TEMP/$EVIDENCIAS_CI/privado/api" -- pnpm exec vitest run --config vitest.api.config.ts --reporter=json --outputFile=test-results/api.json

      - name: Navegador com nova pilha exclusiva
        if: ${{ !cancelled() && steps.evidencias_preparo.outcome == 'success' }}
        run: node tests/isolamento/evidencias-ci.mjs executar --raiz "$RUNNER_TEMP/$EVIDENCIAS_CI" --etapa e2e -- node tests/isolamento/executar.mjs --artefatos "$RUNNER_TEMP/$EVIDENCIAS_CI/privado/e2e" -- sh -c 'PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/e2e.json pnpm exec playwright test --project=chromium --reporter=json'

      - name: PWA com nova pilha exclusiva e build de produção
        if: ${{ !cancelled() && steps.evidencias_preparo.outcome == 'success' }}
        run: node tests/isolamento/evidencias-ci.mjs executar --raiz "$RUNNER_TEMP/$EVIDENCIAS_CI" --etapa pwa -- node tests/isolamento/executar.mjs --artefatos "$RUNNER_TEMP/$EVIDENCIAS_CI/privado/pwa" -- sh -c 'PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/pwa.json pnpm exec playwright test --config=playwright.pwa.config.ts --project=chromium --reporter=json'

      - name: Coletar resumo estruturado mesmo após falha
        if: ${{ always() && steps.evidencias_preparo.outcome == 'success' }}
        run: node tests/isolamento/evidencias-ci.mjs coletar --raiz "$RUNNER_TEMP/$EVIDENCIAS_CI"

      # Não publicar relatórios brutos, capturas, sessões, traces ou diretórios privados.
      # Os sete PNGs oficiais exigem canal privado expressamente autorizado.
      - name: Preservar somente resultados mínimos por sete dias
        if: ${{ always() && steps.evidencias_preparo.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testes-minimos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.EVIDENCIAS_CI }}/publico/resumo.json
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          retention-days: 7
