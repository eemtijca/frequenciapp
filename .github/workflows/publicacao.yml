# Publica duas imagens somente após conciliar versão, tag e commit do pacote.
name: Publicação da imagem
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versao:
        description: Versão estável sem v; executar o workflow na tag correspondente
        required: true
        type: string
permissions:
  contents: read
jobs:
  validar:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.identidade.outputs.versao }}
      tag: ${{ steps.identidade.outputs.tag }}
      sha: ${{ steps.identidade.outputs.sha }}
      latest: ${{ steps.identidade.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Inventariar releases antes de publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - id: identidade
        env:
          PUBLICACAO_RELEASES: ${{ runner.temp }}/releases.json
        run: node scripts/github/validar-publicacao.mjs
  imagem:
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publicacao-${{ needs.validar.outputs.versao }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validar.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validar.outputs.versao }}
            ghcr.io/${{ github.repository }}:sha-${{ needs.validar.outputs.sha }}
            ${{ needs.validar.outputs.latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.version=${{ needs.validar.outputs.versao }}
            org.opencontainers.image.revision=${{ needs.validar.outputs.sha }}
            org.opencontainers.image.ref.name=${{ needs.validar.outputs.tag }}
          build-args: |
            COMMIT_SHA=${{ needs.validar.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/servidor/backup
          file: infra/servidor/backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_IMAGEM=ghcr.io/${{ github.repository }}:${{ needs.validar.outputs.versao }}
          tags: |
            ghcr.io/${{ github.repository }}-backup:${{ needs.validar.outputs.versao }}
            ghcr.io/${{ github.repository }}-backup:sha-${{ needs.validar.outputs.sha }}
            ${{ needs.validar.outputs.latest == 'true' && format('ghcr.io/{0}-backup:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.version=${{ needs.validar.outputs.versao }}
            org.opencontainers.image.revision=${{ needs.validar.outputs.sha }}
            org.opencontainers.image.ref.name=${{ needs.validar.outputs.tag }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
