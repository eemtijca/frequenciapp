# Cópia diária às 02h17 de Fortaleza, com configuração privada e temporária no runner.
name: Backup externo das planilhas

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-externo-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backup:
    name: Criar e conferir a cópia externa
    if: >-
      vars.BACKUP_EXTERNO != 'servidor' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verificar os secrets do backup
        env:
          BACKUP_RCLONE_CONFIG_CONTEUDO: ${{ secrets.BACKUP_RCLONE_CONFIG }}
          BACKUP_ORIGEM: ${{ secrets.BACKUP_ORIGEM }}
          BACKUP_DESTINO: ${{ secrets.BACKUP_DESTINO }}
          BACKUP_CHAVE: ${{ secrets.BACKUP_CHAVE }}
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
        run: bash scripts/backup/backup-actions.sh --validar

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Instalar dependências sem scripts de instalação
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Instalar rclone da distribuição
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends rclone

      - name: Executar o backup e conferir o envio
        env:
          BACKUP_RCLONE_CONFIG_CONTEUDO: ${{ secrets.BACKUP_RCLONE_CONFIG }}
          BACKUP_ORIGEM: ${{ secrets.BACKUP_ORIGEM }}
          BACKUP_DESTINO: ${{ secrets.BACKUP_DESTINO }}
          BACKUP_CHAVE: ${{ secrets.BACKUP_CHAVE }}
          RCLONE_CONFIG_PASS: ${{ secrets.RCLONE_CONFIG_PASS }}
        run: bash scripts/backup/backup-actions.sh

      - name: Remover configuração e temporários
        if: always() && steps.checkout.outcome == 'success'
        run: bash scripts/backup/backup-actions.sh --limpar
