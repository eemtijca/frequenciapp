name: Infraestrutura

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/floci/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2

      - name: Preparar o Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.1"

      - name: Guardar os provedores
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}

      - name: Conferir a formatação
        run: terraform fmt -check -recursive infra/terraform

      - name: Validar os módulos
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for nuvem in aws azure gcp; do
            terraform -chdir="infra/terraform/${nuvem}" init -no-color -input=false -backend=false
            terraform -chdir="infra/terraform/${nuvem}" validate -no-color
          done

  floci:
    name: Aplicar no Floci (${{ matrix.nuvem }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validar
    strategy:
      fail-fast: false
      matrix:
        nuvem: [aws, azure, gcp]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2

      - name: Preparar o Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.1"

      - name: Guardar os provedores
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Guardar as camadas da imagem
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/docker-cache
          key: docker-frequenciapp-${{ hashFiles('pnpm-lock.yaml', 'Dockerfile') }}

      - name: Construir a imagem da aplicação
        run: |
          docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe --name frequenciapp >/dev/null
          docker buildx build --load --cache-from type=local,src=/tmp/docker-cache \
            --cache-to type=local,dest=/tmp/docker-cache,mode=max \
            -t frequenciapp:local .

      - name: Aplicar e conferir
        run: bash infra/floci/testar.sh ${{ matrix.nuvem }}
