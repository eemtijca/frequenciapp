# Valida os arquivos de servidor auto-hospedado, os workflows e as rotinas.
name: Servidor

on:
  pull_request:
    paths:
      - "compose.servidor*.yml"
      - "compose.yml"
      - "Dockerfile"
      - "infra/servidor/**"
      - "infra/kubernetes/**"
      - "scripts/servidor/**"
      - "tests/servidor/**"
      - "package.json"
      - "docs/auto-hospedagem.md"
      - "docs/backup-servidor.md"
      - "docs/kubernetes.md"
      - ".github/workflows/servidor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servidor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Compose, proxies, scripts e workflows
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validar servidor
        run: bash infra/servidor/validar.sh

      - name: Validar chart Helm
        run: |
          mkdir -p "$RUNNER_TEMP/helm"
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:latest@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e \
            lint infra/kubernetes/frequenciapp \
            --set existingSecret=frequenciapp-segredos
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$RUNNER_TEMP/helm:/out" \
            -w /repo \
            alpine/helm:latest@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e \
            template frequenciapp infra/kubernetes/frequenciapp \
            --namespace frequenciapp \
            --set existingSecret=frequenciapp-segredos \
            --set image.tag=1.2.3 \
            --set backup.enabled=true \
            --set backup.filesSecret=frequenciapp-backup-arquivos \
            --set backup.database.existingSecret=frequenciapp-backup-banco \
            --set backup.spreadsheets.existingSecret=frequenciapp-backup-planilhas \
            --set backup.database.persistence.enabled=true \
            --output-dir /out
          docker run --rm \
            -v "$RUNNER_TEMP/helm:/out" \
            ghcr.io/yannh/kubeconform:latest@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary /out

      - name: Validar workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Instalar ferramentas dos ensaios
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck rclone age postgresql-common
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Sintaxe e ShellCheck
        run: |
          for script in scripts/servidor/*.sh; do
            bash -n "$script"
          done
          shellcheck -x -P scripts/servidor scripts/servidor/*.sh
          shellcheck -x -P tests/servidor tests/servidor/*.sh

      - name: Ensaio de atualização com dublês
        run: bash tests/servidor/atualizacao.sh

      - name: Ensaio de backup e restauração em Compose
        run: bash tests/servidor/backup-restauracao.sh

      - name: Ensaio do desafio ACME no Nginx
        run: bash tests/servidor/nginx-acme.sh

      - name: Ensaio de restauração por URL
        run: bash tests/servidor/restauracao-url.sh

      - name: Ensaio de privilégios do schema de preview
        run: bash tests/servidor/privilegios-preview.sh

      - name: Ensaio de atualização em Compose descartável
        run: bash tests/servidor/atualizacao-integracao.sh

      - name: Derrubar contêineres remanescentes
        if: always()
        run: |
          docker ps -aq --filter "name=frequenciapp-" | xargs -r docker rm -f
