# Valida o instalador cross-distro: qualidade, unidade e matriz Docker de plano.
name: Instalador

on:
  pull_request:
    paths:
      - "instalar.sh"
      - "scripts/instalador/**"
      - "tests/instalador/**"
      - "scripts/servidor/**"
      - "tests/servidor/controlador/**"
      - "docker/app/migrar.mjs"
      - "src/infra/schema-postgres.mjs"
      - "scripts/github/ferramentas.json"
      - "infra/servidor/**"
      - "compose*.yml"
      - ".env.example"
      - "package.json"
      - "docs/instalador.md"
      - ".github/workflows/instalador.yml"
  workflow_dispatch:

concurrency:
  group: instalador-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade do instalador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Instalar ferramentas de análise
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          prettier@3.9.10 prettier-plugin-tailwindcss@0.8.1
          eslint@9.39.2 eslint-config-next@16.4.5 typescript@5.9.3

      - name: Prettier
        run: >
          ./node_modules/.bin/prettier --check
          scripts/instalador tests/instalador
          .github/workflows/instalador.yml docs/instalador.md package.json

      - name: ESLint
        run: ./node_modules/.bin/eslint scripts/instalador tests/instalador

      - name: Sintaxe do Bash
        run: bash -n instalar.sh

      - name: ShellCheck
        run: >
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
          instalar.sh

      - name: Actionlint
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:latest@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  unidade:
    name: Unidade do instalador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - name: Preparar imagem apenas com fontes públicas versionadas
        shell: bash
        run: |
          set -Eeuo pipefail
          contexto=$(mktemp -d "$RUNNER_TEMP/instalador-unit.XXXXXXXX")
          git archive --format=tar HEAD scripts/servidor scripts/instalador \
            tests/servidor/controlador tests/instalador infra/servidor \
            docker/app/migrar.mjs src/infra/schema-postgres.mjs package.json instalar.sh .env.example \
            compose.yml compose.servidor.yml compose.servidor-caddy.yml \
            compose.servidor-nginx.yml | tar -x -C "$contexto"
          docker build --network default \
            -f "$contexto/tests/servidor/controlador/Dockerfile" \
            -t "frequenciapp-instalador-unit-teste:${{ github.run_id }}-${{ github.run_attempt }}" "$contexto"

      - name: Testes unitários em contêiner sem privilégios
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --ipc private --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 1000:1000 \
            --pids-limit 512 --memory 2g --cpus 2 \
            --tmpfs /scratch:rw,nosuid,nodev,exec,size=4g,mode=1777 \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777 \
            --workdir /repo \
            --env HOME=/scratch --env TMPDIR=/scratch \
            --env INSTALADOR_LOCK_DIR=/scratch/instalador-lock --env INSTALADOR_MATRIZ=0 \
            --entrypoint /bin/bash \
            "frequenciapp-instalador-unit-teste:${{ github.run_id }}-${{ github.run_attempt }}" \
            -c 'umask 077; exec node --test --test-reporter=tap --test-concurrency=1 tests/instalador/*.test.mjs'

  controlador:
    name: Controlador e Git administrativo isolados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar imagem apenas com fontes públicas versionadas
        shell: bash
        run: |
          set -Eeuo pipefail
          contexto=$(mktemp -d "$RUNNER_TEMP/controlador.XXXXXXXX")
          git archive --format=tar HEAD scripts/servidor scripts/instalador \
            tests/servidor/controlador tests/instalador infra/servidor \
            docker/app/migrar.mjs src/infra/schema-postgres.mjs package.json instalar.sh .env.example \
            compose.yml compose.servidor.yml compose.servidor-caddy.yml \
            compose.servidor-nginx.yml | tar -x -C "$contexto"
          docker build --network default \
            -f "$contexto/tests/servidor/controlador/Dockerfile" \
            -t "frequenciapp-controlador-teste:${{ github.run_id }}-${{ github.run_attempt }}" "$contexto"

      - name: Testar com root interno sem rede ou socket Docker
        run: >
          docker run --rm --network none --ipc private --read-only --cap-drop ALL
          --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID
          --security-opt no-new-privileges --user 0:0
          --pids-limit 512 --memory 2g --cpus 2
          --env HOME=/scratch --env TMPDIR=/scratch
          --env INSTALADOR_LOCK_DIR=/scratch/instalador-lock --env INSTALADOR_MATRIZ=0
          --tmpfs /scratch:rw,nosuid,nodev,exec,size=4g,mode=1777
          --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777
          "frequenciapp-controlador-teste:${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Testar Git real com proprietários distintos sem rede ou socket Docker
        run: >
          docker run --rm --network none --ipc private --read-only --cap-drop ALL
          --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID
          --security-opt no-new-privileges --user 0:0
          --env HOME=/scratch --env TMPDIR=/scratch
          --env INSTALADOR_LOCK_DIR=/scratch/instalador-lock --env INSTALADOR_MATRIZ=0
          --pids-limit 512 --memory 2g --cpus 2
          --tmpfs /scratch:rw,nosuid,nodev,exec,size=4g,mode=1777
          --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m,mode=1777
          "frequenciapp-controlador-teste:${{ github.run_id }}-${{ github.run_attempt }}"
          bash -c 'umask 022; exec node --test --test-reporter=tap --test-concurrency=1 tests/instalador/administrativo/*.test.mjs'

  matriz:
    name: Matriz Docker de plano
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Matriz de planejar
        run: node --test --test-reporter=tap tests/instalador/matriz.test.mjs
