# Aplica etiquetas de área aos pull requests conforme os caminhos alterados.
"area: chamada":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/chamada/**"
          - "src/components/chamada-parcial/**"
          - "src/components/grade/**"
          - "src/app/api/frequencias/**"
          - "src/app/api/frequencias-parciais/**"

"area: interface":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/ui/**"
          - "src/components/painel/**"
          - "src/components/entrada/**"
          - "src/components/movimentacoes/**"
          - "src/components/relatorios/**"
          - "src/components/alunos/**"
          - "src/components/diretor/**"
          - "src/components/bi/**"
          - "src/app/superficies.css"
          - "src/app/globals.css"

"area: planilhas":
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/planilha*"
          - "src/infra/google/**"

"area: gestao":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/gestao/**"
          - "src/components/diretor/**"
          - "src/app/api/configuracoes/**"
          - "src/app/api/diretor*/**"
          - "src/app/api/parametros-acesso/**"

"area: notificacoes":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/api/notificacoes/**"

"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".devcontainer/**"
          - "docker/**"
          - "infra/**"
          - "prisma/**"
          - "scripts/**"
          - "compose.yml"
          - "compose.ci.yml"
          - "Dockerfile"
          - "next.config.ts"
          - "vercel.json"
