# Aplica etiquetas de área aos pull requests conforme os caminhos alterados.
"area: chamada":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/frequencia/**"
          - "src/components/frequencia-parcial/**"
          - "src/components/grade/**"
          - "src/app/api/frequencias/**"
          - "src/app/api/frequencias-parciais/**"

"area: interface":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/ui/**"
          - "src/components/painel/**"
          - "src/app/vidro.css"
          - "src/app/globals.css"

"area: planilhas":
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/planilha*"
          - "src/**/google-*"
          - "gas/**"

"area: gestao":
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/gestao/**"
          - "src/components/diretor/**"
          - "src/app/api/configuracoes/**"
          - "src/app/api/diretor*/**"
          - "src/app/api/parametros-acesso/**"

"area: notificacoes":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/api/notificacoes/**"

"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".devcontainer/**"
          - "docker/**"
          - "infra/**"
          - "prisma/**"
          - "scripts/**"
          - "compose.yml"
          - "compose.ci.yml"
          - "Dockerfile"
          - "next.config.ts"
          - "vercel.json"
