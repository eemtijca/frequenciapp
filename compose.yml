# FrequenciApp. Orquestração local: aplicação + PostgreSQL.
# Sobe tudo com: docker compose up --build
# A aplicação usa o pool local e aplica as migrações pela conexão direta.
# DB_HOST permite trocar o hostname do PostgreSQL; o padrão é `db`.

name: frequenciapp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frequencia
      POSTGRES_PASSWORD: frequencia
      POSTGRES_DB: frequencia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frequencia -d frequencia"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://frequencia:frequencia@${DB_HOST:-db}:5432/frequencia
      DIRECT_URL: postgresql://frequencia:frequencia@${DB_HOST:-db}:5432/frequencia
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
      TZ_APP: ${TZ_APP:-America/Fortaleza}
    command: ["./docker/app/entrypoint.sh"]

volumes:
  pgdata:
