# Orquestração local: aplicação + PostgreSQL. Sobe com
# `docker compose up --build`; as URLs internas usam o host `db`.

name: frequenciapp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frequencia
      POSTGRES_PASSWORD: frequencia
      POSTGRES_DB: frequencia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frequencia -d frequencia"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://frequencia:frequencia@db:5432/frequencia
      DIRECT_URL: postgresql://frequencia:frequencia@db:5432/frequencia
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
      TZ_APP: ${TZ_APP:-America/Fortaleza}
      # Implantação sem TLS em rede confiável (ver .env.example).
      PERMITIR_HTTP: ${PERMITIR_HTTP:-false}
      # Bootstrap opcional do administrador inicial. Quando preenchidas no
      # .env, o entrypoint cria o admin apenas se ele ainda não existir.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
    command: ["./docker/app/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/saude').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
