# Observabilidade auto-hospedada: Prometheus, node exporter e blackbox ficam na
# rede interna; apenas a ponte socat expõe o painel no loopback.

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      METRICAS_TOKEN: ${METRICAS_TOKEN:?Defina METRICAS_TOKEN no app.env}
    volumes:
      - ./infra/observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observabilidade/prometheus/regras.yml:/etc/prometheus/regras.yml:ro
      - ./infra/observabilidade/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus_data:/prometheus
    networks:
      - interna
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus-ui:
    image: alpine/socat:1.8.1.3@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
    restart: unless-stopped
    command: ["TCP-LISTEN:9090,fork,reuseaddr", "TCP:prometheus:9090"]
    user: "65534:65534"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORTA:-9090}:9090"
    networks:
      - interna
      - publica
    depends_on:
      prometheus:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /:/host:ro,rslave
      - ${ESTADO_DIR:-/var/lib/frequenciapp}/metricas:/var/lib/node_exporter/textfile:ro
    networks:
      - interna
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 10s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/blackbox_exporter/entrypoint.sh"]
    command: ["--config.file=/tmp/blackbox.yml"]
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO no arquivo de ambiente}
    volumes:
      - ./infra/observabilidade/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
      - ./infra/observabilidade/blackbox/entrypoint.sh:/etc/blackbox_exporter/entrypoint.sh:ro
    networks:
      - interna
      - publica
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  prometheus_data:
