# Observabilidade auto-hospedada: o Prometheus fica na rede interna, sem portas
# publicadas nem saída, e apenas a ponte socat expõe o painel no loopback.

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      METRICAS_TOKEN: ${METRICAS_TOKEN:?Defina METRICAS_TOKEN no app.env}
    volumes:
      - ./infra/observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observabilidade/prometheus/regras.yml:/etc/prometheus/regras.yml:ro
      - ./infra/observabilidade/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus_data:/prometheus
    networks:
      - interna
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus-ui:
    image: alpine/socat:1.8.1.3@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
    restart: unless-stopped
    command: ["TCP-LISTEN:9090,fork,reuseaddr", "TCP:prometheus:9090"]
    user: "65534:65534"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORTA:-9090}:9090"
    networks:
      - interna
      - publica
    depends_on:
      prometheus:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 10s

volumes:
  prometheus_data:
